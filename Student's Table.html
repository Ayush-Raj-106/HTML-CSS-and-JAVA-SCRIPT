<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marks Table</title>

<style>
body{
    background:#fff;
    font-family: Arial, sans-serif;
}

/* Outer frame */
.frame{
    width: 650px;
    margin: 30px auto;
    border: 4px solid black;
    border-radius: 30px;
    padding: 18px;
}

/* Inner dotted frame */
.inner{
    border: 2px dotted black;
    border-radius: 20px;
    padding: 20px;
}

/* Title box */
.title-box{
    width: 70%;
    margin: 0 auto 20px auto;
    border: 2px solid black;
    border-radius: 10px;
    padding: 8px 0;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

/* Table */
table{
    width: 100%;
    border-collapse: collapse;
    text-align: center;
}

th{
    border: 2px solid black;
    padding: 10px;
    font-weight: bold;
}

td{
    padding: 15px 10px;
}

/* Thick vertical column lines */
td:not(:last-child),
th:not(:last-child) {
    border-right: 5px solid black;
}

/* Left & right borders of table */
table {
    border-left: 3px solid black;
    border-right: 3px solid black;
}

/* Vertical guide lines inside rows to mimic image */
tbody tr td {
    border-bottom: none;
}

/* Slightly narrower student column */
th:first-child,
td:first-child{
    width: 22%;
}
</style>

</head>
<body>

<div class="frame">
    <div class="inner">

        <div class="title-box">
            Marks table
        </div>

        <table>
            <thead>
                <tr>
                    <th>student</th>
                    <th>Maths</th>
                    <th>Physics</th>
                    <th>Computer Science</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Name</td>
                    <td>54</td>
                    <td>32</td>
                    <td>23</td>
                </tr>
                <tr>
                    <td>Name</td>
                    <td>54</td>
                    <td>32</td>
                    <td>23</td>
                </tr>
                <tr>
                    <td>Name</td>
                    <td>54</td>
                    <td>32</td>
                    <td>23</td>
                </tr>
                <tr>
                    <td>Name</td>
                    <td>54</td>
                    <td>32</td>
                    <td>23</td>
                </tr>
            </tbody>
        </table>

    </div>
</div>

</body>
</html>
