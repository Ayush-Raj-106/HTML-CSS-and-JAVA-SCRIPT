<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile Card</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#f5f5f5;
    font-family:Arial, Helvetica, sans-serif;
}

/* Outer container */
.outer{
    width:430px;
    margin:40px auto;
    background:white;
    border-radius:18px;
    padding:16px;
    border:2px solid #dcdcdc;
}

/* Sections */
.section{
    margin-bottom:18px;
    border-radius:8px;
    padding:18px 22px;
    color:white;
}

/* Top Image Section */
.top-section{
    background:#55b657;
    height:130px;
    display:flex;
    align-items:center;
}

.top-section img{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid white;
}

/* Name Section */
.name-section{
    background:#2794f0;
}

.name-section h1{
    font-size:26px;
    margin-bottom:6px;
}

/* Yellow job title text */
.job{
    color:#ffd700;
    font-size:14px;
}

/* About Section */
.about-section{
    background:#ffc400;
    font-size:14px;
    line-height:1.5;
}

/* Contact Section */
.contact-section{
    background:#9b35af;
    font-size:14px;
    line-height:1.6;
}

/* Footer / Links */
.footer-section{
    background:#ff5a1f;
    display:flex;
    gap:30px;
    font-size:16px;
}

.footer-section a{
    text-decoration:none;
    color:yellow;
    font-weight:bold;
}

.footer-section a:hover{
    text-decoration:underline;
}
</style>
</head>
<body>

<div class="outer">

    <!-- Image -->
    <div class="section top-section">
        <!-- Replace avatar.jpg with your image -->
        <img src="https://preview.redd.it/n1n2ujvfztg71.jpg?width=1702&format=pjpg&auto=webp&s=96b5e1ca1ae9a2ed1fdd7e71c0bf6b624d0231b3" alt="Profile Image">
    </div>

    <!-- Name -->
    <div class="section name-section">
        <h1>RED</h1>
        <p class="job">Web Developer at Tech Solutions</p>
    </div>

    <!-- About -->
    <div class="section about-section">
        Passionate about creating innovative web solutions 
        that enhance user experience and functionality.
        Experienced in HTML, CSS, JavaScript, and responsive
        design.
    </div>

    <!-- Contact -->
    <div class="section contact-section">
        <p><strong>Email:</strong>red@example.com</p>
        <p><strong>Phone:</strong> (123) 456-7890</p>
    </div>

    <!-- Social Links -->
    <div class="section footer-section">
        <a href="https://twitter.com" target="_blank">Twitter</a>
        <a href="https://www.linkedin.com" target="_blank">LinkedIn</a>
    </div>

</div>

</body>
</html>
